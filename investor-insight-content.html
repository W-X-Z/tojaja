<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>투자자탭 AI 인사이트 · 콘텐츠 컨셉 갤러리</title>
<style>
  :root{
    --up:#e23b3b; --down:#2f6fe8; --warn:#e8973a; --good:#1f9d6b;
    --ink:#15171c; --ink2:#5a606b; --ink3:#9298a3; --line:#e9eaee;
    --bg:#f3f4f7; --card:#fff; --soft:#f7f8fa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    padding:30px 20px 60px;
  }
  .page-head{max-width:1180px;margin:0 auto 26px;}
  .page-head h1{font-size:20px;margin:0 0 6px;letter-spacing:-.3px;}
  .page-head p{margin:0;color:var(--ink2);font-size:13.5px;line-height:1.6;max-width:760px;}
  .page-head .why{margin-top:10px;font-size:12.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-width:760px;}
  .page-head .why b{color:var(--ink);}

  .gallery{
    max-width:1180px;margin:0 auto;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(332px,1fr));gap:30px 26px;
  }
  .item{display:flex;flex-direction:column;gap:10px;}
  .cap{padding-left:2px;}
  .cap .num{font-size:11px;font-weight:800;color:#fff;background:var(--ink);border-radius:6px;padding:2px 7px;letter-spacing:.4px;}
  .cap .t{font-size:14.5px;font-weight:700;margin:7px 0 2px;letter-spacing:-.2px;}
  .cap .d{font-size:12px;color:var(--ink2);line-height:1.5;}

  /* 폰 프레임 */
  .phone{
    width:332px;background:#0c0d10;border-radius:30px;padding:8px;
    box-shadow:0 16px 38px rgba(20,24,33,.18);align-self:center;
  }
  .scr{background:#fff;border-radius:24px;overflow:hidden;}
  .ph-head{
    display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);
  }
  .ph-head .tag{font-size:10.5px;font-weight:800;color:#fff;background:var(--ink);border-radius:5px;padding:2px 6px;letter-spacing:.4px;}
  .ph-head .ttl{font-size:13.5px;font-weight:700;}
  .ph-head .px{margin-left:auto;font-size:11px;color:var(--ink3);}
  .body{padding:16px;}

  h4.mh{font-size:13px;margin:0 0 10px;color:var(--ink2);font-weight:700;}
  .lead{font-size:15px;line-height:1.55;font-weight:700;margin:0 0 14px;letter-spacing:-.3px;}
  .up{color:var(--up);} .down{color:var(--down);} .warn{color:var(--warn);} .good{color:var(--good);}
  b.up,b.down,b.warn,b.good{font-weight:800;}
  .muted{color:var(--ink2);}
  .src{font-size:10.5px;color:var(--ink3);margin-top:14px;line-height:1.5;}

  /* 흐름 카드 (컨셉1) */
  .flow{display:flex;gap:11px;padding:12px;border:1px solid var(--line);border-radius:13px;margin-bottom:10px;background:var(--soft);}
  .flow .ic{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;}
  .flow .ic.dn{background:var(--down);} .flow .ic.up{background:var(--up);} .flow .ic.nu{background:var(--ink3);}
  .flow .fb .ft{font-size:13px;font-weight:700;margin-bottom:3px;}
  .flow .fb .fd{font-size:12px;color:var(--ink2);line-height:1.5;}
  .flow .fb .fd em{font-style:normal;font-weight:700;color:var(--ink);}
  .verdict{background:#10131a;color:#eef1f6;border-radius:13px;padding:13px 14px;font-size:13px;line-height:1.6;}
  .verdict b{color:#fff;}

  /* 점수 게이지 (컨셉2) */
  .gauge-wrap{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
  .gauge{position:relative;width:108px;height:108px;flex-shrink:0;}
  .gauge .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .gauge .val .n{font-size:28px;font-weight:800;letter-spacing:-1px;}
  .gauge .val .s{font-size:10px;color:var(--ink3);}
  .grade .gl{font-size:11px;color:var(--ink3);margin-bottom:3px;}
  .grade .gt{font-size:15px;font-weight:800;line-height:1.35;letter-spacing:-.3px;}
  .bar-row{margin-bottom:11px;}
  .bar-row .br-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
  .bar-row .br-top .bn{color:var(--ink2);} .bar-row .br-top .bv{font-weight:700;}
  .track{height:7px;background:#edeef2;border-radius:99px;overflow:hidden;}
  .fillb{height:100%;border-radius:99px;}

  /* 주체 카드 (컨셉3) */
  .who{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px;}
  .who .wh{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .who .wh .nm{font-size:14px;font-weight:800;}
  .who .wh .pl{margin-left:auto;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;}
  .pill-up{background:#fdecec;color:var(--up);} .pill-dn{background:#e9f0fe;color:var(--down);}
  .who .pos{font-size:12px;color:var(--ink2);margin-bottom:7px;line-height:1.5;}
  .who .intent{font-size:12.5px;line-height:1.55;}
  .who .intent .lab{font-weight:800;color:var(--ink);}
  .role{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;}
  .role.smart{background:#e7f5ef;color:var(--good);} .role.exit{background:#e9f0fe;color:var(--down);}
  .role.hot{background:#fdf0e3;color:var(--warn);} .role.pass{background:#eef0f3;color:var(--ink2);}

  /* 매물대 지도 (컨셉4) */
  .map{display:flex;gap:12px;}
  .axis{position:relative;width:46px;flex-shrink:0;border-left:2px solid var(--line);}
  .lvl{position:absolute;left:-2px;border-top:2px dashed #cfd3da;width:100%;}
  .lvl .lt{position:absolute;left:8px;top:-9px;font-size:10px;color:var(--ink3);white-space:nowrap;}
  .map-notes{flex:1;}
  .wall{background:#eef0f3;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:10px;}
  .wall .wt{font-size:12px;font-weight:800;margin-bottom:4px;}
  .wall .wd{font-size:11.5px;color:var(--ink2);line-height:1.5;}
  .pricebar{position:relative;width:78px;flex-shrink:0;border-radius:10px;overflow:hidden;background:linear-gradient(#fdecec,#fff 55%,#e9f0fe);border:1px solid var(--line);}
  .marker{position:absolute;left:0;right:0;display:flex;align-items:center;}
  .marker .ln{height:0;border-top:1.5px solid;flex:1;}
  .marker .mt{position:absolute;font-size:9.5px;font-weight:700;background:#fff;padding:0 3px;border-radius:3px;}

  /* 경보 (컨셉5) */
  .alert{border-radius:13px;padding:14px;border:1px solid;}
  .alert.lv-warn{background:#fef6ec;border-color:#f6dcb6;}
  .alert .al-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--warn);margin-bottom:8px;}
  .alert .badge{font-size:10.5px;font-weight:800;color:#fff;background:var(--warn);border-radius:6px;padding:2px 7px;}
  .alert p{margin:0 0 8px;font-size:12.5px;line-height:1.6;color:#4a4030;}
  .nuance{background:#fff;border:1px dashed #e3c79c;border-radius:9px;padding:9px 10px;font-size:11.5px;color:var(--ink2);line-height:1.5;}

  /* Q&A (컨셉6) */
  .qa{border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden;}
  .qa .q{display:flex;gap:8px;align-items:center;padding:12px 13px;cursor:pointer;font-size:13px;font-weight:700;background:var(--soft);}
  .qa .q .qm{color:var(--down);font-weight:800;}
  .qa .q .ch{margin-left:auto;color:var(--ink3);transition:transform .2s;}
  .qa.open .q .ch{transform:rotate(180deg);}
  .qa .a{display:none;padding:0 13px 13px;font-size:12.5px;line-height:1.6;color:var(--ink2);}
  .qa.open .a{display:block;}
  .qa .a .em{color:var(--ink);font-weight:700;}

  /* 시나리오/체크 (컨셉7) */
  .chk{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.5;}
  .chk .mk{flex-shrink:0;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;margin-top:1px;}
  .chk .mk.ok{background:var(--good);} .chk .mk.no{background:var(--warn);}
  .scn{margin-top:13px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;}
  .scn .si{font-size:12.5px;line-height:1.6;margin-bottom:8px;}
  .scn .si:last-child{margin-bottom:0;}
  .scn .si .cond{font-weight:800;color:var(--ink);}
  .scn .si.bull .cond{color:var(--up);} .scn .si.bear .cond{color:var(--down);}
  .sec-h{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--ink3);margin:4px 0 4px;}
</style>
</head>
<body>
  <div class="page-head">
    <h1>투자자탭 AI 인사이트 · 콘텐츠 컨셉 갤러리</h1>
    <p>표/차트를 보면 바로 아는 수치가 아니라, <b>데이터를 해석해야 보이는 "더 깊은" 인사이트</b>를 어떤 콘텐츠로 만들 수 있을지 7가지 방향으로 시도한 모바일 상세화면 시안입니다. (현대차 005380 · 투자자탭 데이터만 사용)</p>
    <div class="why"><b>핵심 차별점:</b> 단순 순매수 수치 → <b>흐름의 변화(매도 둔화·매수 가속), 주체의 의도, 손바뀜 구조, 매물대, 과열 신호, 조건부 시나리오</b>로 가공.</div>
  </div>

  <div class="gallery" id="gallery"></div>

<script>
/* ============ 데이터(해석 결과) ============ */
const D = {
  // 일평균 순매수(만주)
  foreignAvg9:-15.7, foreignAvg5:-11.2,
  instAvg9:6.0, instAvg5:11.2,
  indivCum9:80.4, indivCum5:-3.1,
  instStreak:8,
  // 6개월 누적(만주)
  cum:{indiv:1776, foreign:-2024, program:-1520, inst:112},
  // 평단(만원)/현재가 대비 손익(%)
  avg:{foreign:{p:64.0,pl:18.2}, inst:{p:64.2,pl:17.7}, indiv:{p:65.4,pl:15.6}, fin:{p:65.5,pl:15.3}},
  price:75.6, chg9:28.4
};

/* ============ 컨셉 1 — 수급 스토리(흐름의 변화) ============ */
function c1(){return `
  <h4 class="mh">표에는 안 보이는 '흐름의 변화'</h4>
  <p class="lead">최근 5거래일, 수급의 <span class="up">주인공이 바뀌는 중</span>이에요.</p>
  <div class="flow">
    <div class="ic dn">↓</div>
    <div class="fb"><div class="ft down">외국인 — 매도세가 약해지고 있어요</div>
      <div class="fd">일평균 순매도가 <em>−15.7만주(9일)</em> → <em>−11.2만주(5일)</em>로 줄었어요. 던지는 힘이 빠지는 중.</div></div>
  </div>
  <div class="flow">
    <div class="ic up">↑</div>
    <div class="fb"><div class="ft up">기관 — 매수에 가속이 붙었어요</div>
      <div class="fd">일평균 순매수가 <em>+6.0만주(9일)</em> → <em>+11.2만주(5일)</em>, 게다가 <em>8거래일 연속</em> 순매수.</div></div>
  </div>
  <div class="flow">
    <div class="ic nu">≈</div>
    <div class="fb"><div class="ft">개인 — 슬슬 차익실현 시작</div>
      <div class="fd">9일간 <em>+80만주</em> 사들였지만 최근 5일은 <em>−3만주</em>로 매수를 멈췄어요.</div></div>
  </div>
  <div class="verdict">외국인이 던지던 물량을 이제 <b>기관이 받아내고</b>, 개인은 <b>한 발 빼는</b> 손바뀜 국면.
    파는 쪽 힘이 약해지는 신호로 읽을 수 있어요. <span style="opacity:.7">(추세 전환은 추가 확인 필요)</span></div>
  <div class="src">출처: MTS 투자자탭(목업) · 일평균=기간 순매수합÷거래일</div>`;}

/* ============ 컨셉 2 — 수급 건전성 점수 ============ */
function c2(){
  const score=58, C=2*Math.PI*46, off=C*(1-score/100);
  const bars=[
    {n:"기관 매집 강도",v:80,c:"var(--good)"},
    {n:"외국인 흐름",v:38,c:"var(--down)"},
    {n:"개인 쏠림(역지표)",v:40,c:"var(--warn)"},
    {n:"가격·수급 정합성",v:50,c:"var(--ink3)"},
  ];
  return `
  <h4 class="mh">수급 건전성 한눈에</h4>
  <div class="gauge-wrap">
    <div class="gauge">
      <svg width="108" height="108" viewBox="0 0 108 108">
        <circle cx="54" cy="54" r="46" fill="none" stroke="#edeef2" stroke-width="11"/>
        <circle cx="54" cy="54" r="46" fill="none" stroke="var(--warn)" stroke-width="11"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"
          transform="rotate(-90 54 54)"/>
      </svg>
      <div class="val"><div class="n">${score}</div><div class="s">/ 100</div></div>
    </div>
    <div class="grade">
      <div class="gl">종합 진단</div>
      <div class="gt">기관 주도 매집,<br>개인 과열은 주의</div>
    </div>
  </div>
  ${bars.map(b=>`
    <div class="bar-row">
      <div class="br-top"><span class="bn">${b.n}</span><span class="bv">${b.v}</span></div>
      <div class="track"><div class="fillb" style="width:${b.v}%;background:${b.c}"></div></div>
    </div>`).join("")}
  <div class="verdict" style="margin-top:14px">기관 매집은 <b>강하지만</b>, 현재가가 모든 평단을 15~18% 웃돌고 개인 쏠림이 커
    <b>단기 과열</b> 구간으로 평가돼요.</div>
  <div class="src">점수는 4개 신호를 가중 합산한 해석 지표(목업) · 절대 매수/매도 신호가 아닙니다.</div>`;}

/* ============ 컨셉 3 — 주체별 '속마음' 카드 ============ */
function c3(){
  return `
  <h4 class="mh">투자 주체는 지금 무슨 생각일까?</h4>
  <div class="who">
    <div class="wh"><span class="nm">외국인</span><span class="role exit">차익실현 마무리</span><span class="pl pill-up">평단 +18%</span></div>
    <div class="pos">6개월 누적 <b class="down">−2,024만주</b> 순매도 · 평단 약 64.0만원</div>
    <div class="intent"><span class="lab">해석:</span> 이미 대량으로 차익을 실현해 보유를 크게 줄였어요. 그만큼 <b>추가로 던질 물량과 매도 강도는 둔화</b> 중 → 매물 압력은 점차 약해질 수 있어요.</div>
  </div>
  <div class="who">
    <div class="wh"><span class="nm">기관</span><span class="role smart">스마트머니 매집</span><span class="pl pill-up">평단 +18%</span></div>
    <div class="pos">최근 <b class="up">8거래일 연속</b> 순매수 · 매수 가속</div>
    <div class="intent"><span class="lab">해석:</span> 외국인이 내놓는 물량을 받아내는 주체. 단기 수급의 <b>버팀목</b> 역할이라 하방을 지지하는 힘이 됩니다.</div>
  </div>
  <div class="who">
    <div class="wh"><span class="nm">개인</span><span class="role hot">고점 대량매수</span><span class="pl pill-up">평단 +16%</span></div>
    <div class="pos">6개월 누적 <b class="up">+1,776만주</b> · 평단 65.4만원(아직 수익)</div>
    <div class="intent"><span class="lab">해석:</span> 상승 구간에서 대량 매수 = <b class="warn">과열 신호</b>지만, 아직 수익 구간이라 투매 위험은 낮아요. 다만 최근 차익실현 조짐.</div>
  </div>
  <div class="who">
    <div class="wh"><span class="nm">프로그램</span><span class="role pass">패시브 이탈</span><span class="pl pill-dn">매도</span></div>
    <div class="pos">6개월 누적 <b class="down">−1,520만주</b></div>
    <div class="intent"><span class="lab">해석:</span> 차익·패시브 자금 이탈로 외국인 매도와 같은 방향. 수급 부담 요인이지만 강도는 외국인과 함께 둔화 관찰 중.</div>
  </div>
  <div class="src">출처: MTS 투자자탭(목업) · 의도는 데이터 기반 추정입니다.</div>`;}

/* ============ 컨셉 4 — 매물대 지도(지지·저항) ============ */
function c4(){
  return `
  <h4 class="mh">평단으로 보는 매물대 지도</h4>
  <div class="map">
    <div class="pricebar" style="height:230px">
      <div class="marker" style="top:8%"><div class="ln" style="border-color:var(--up)"></div><div class="mt" style="right:2px;color:var(--up)">현재가 75.6만</div></div>
      <div class="marker" style="top:66%"><div class="ln" style="border-color:var(--ink3)"></div><div class="mt" style="right:2px">금융 65.5</div></div>
      <div class="marker" style="top:72%"><div class="ln" style="border-color:var(--ink3)"></div><div class="mt" style="right:2px">개인 65.4</div></div>
      <div class="marker" style="top:80%"><div class="ln" style="border-color:var(--ink3)"></div><div class="mt" style="right:2px">기관 64.2</div></div>
      <div class="marker" style="top:86%"><div class="ln" style="border-color:var(--ink3)"></div><div class="mt" style="right:2px">외국인 64.0</div></div>
    </div>
    <div class="map-notes">
      <div class="wall">
        <div class="wt good">64~65.5만원 = 강한 지지대</div>
        <div class="wd">4개 주체 평균 매수가가 좁은 구간에 <b>몰려 있어요</b>. 주가가 눌릴 때 이 부근에서 매수 대기 수요가 받쳐줄 가능성.</div>
      </div>
      <div class="wall" style="background:#fdf0ee;border-color:#f3cfca">
        <div class="wt up">현재가는 전원 평단 위 = 차익 매물권</div>
        <div class="wd">지금 가격은 모든 주체 평단보다 <b>15~18% 높아요</b>. 위로 갈수록 차익 실현 매물이 나오기 쉬운 위치.</div>
      </div>
    </div>
  </div>
